name: TermMax USDC positive bad-debt forensics

on:
  push:
    branches:
      - audit/termmax-production-evidence
    paths:
      - .github/workflows/usdc-positive-baddebt-forensics.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  TX_HASH: '0x0d94a01690d1c246365a439a6a049e678df8003d1d7800c8ded7f42bed697c57'
  VAULT: '0x17337c22cf8b7c1b6fc86f0ef7fcf05a7fa93f48'
  ORDER: '0x385429223ddc9921f2491c4a16b79c0b0717c431'
  SETTLEMENT_BLOCK: '24826646'

jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone audit branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch audit/termmax-production-evidence \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Query transaction and reconstruct historical vault-share ledger
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p production-evidence
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          tx=os.environ['TX_HASH'].lower(); vault=os.environ['VAULT'].lower(); order=os.environ['ORDER'].lower()
          block=int(os.environ['SETTLEMENT_BLOCK']); preblock=block-1; base='https://eth.blockscout.com'

          def get_json(url, attempts=5):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'termmax-security-validation/1.0','Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=60) as r: return json.loads(r.read())
                  except Exception as exc:
                      last=exc; time.sleep(min(16,2**i))
              return {'_error':repr(last),'_url':url}

          def compat_logs(address, topic0, to_block):
              q=urllib.parse.urlencode({'module':'logs','action':'getLogs','fromBlock':'0','toBlock':str(to_block),'address':address,'topic0':topic0})
              return get_json(base+'/api?'+q)

          transaction=get_json(f'{base}/api/v2/transactions/{tx}')
          internal=get_json(f'{base}/api/v2/transactions/{tx}/internal-transactions')
          transfers=get_json(f'{base}/api/v2/transactions/{tx}/token-transfers')
          logs=get_json(f'{base}/api/v2/transactions/{tx}/logs')

          transfer_topic='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          share_logs=compat_logs(vault,transfer_topic,preblock)
          rows=[]; balances={}; zero='0x'+'0'*40
          raw=share_logs.get('result') if isinstance(share_logs,dict) else []
          if not isinstance(raw,list): raw=[]
          for log in raw:
              topics=[str(x).lower() for x in (log.get('topics') or [])]
              if len(topics)<3: continue
              frm='0x'+topics[1].removeprefix('0x')[-40:]; to='0x'+topics[2].removeprefix('0x')[-40:]
              value=int(str(log.get('data') or '0x0'),16)
              bn=log.get('blockNumber'); bn=int(bn,16) if isinstance(bn,str) and bn.startswith('0x') else int(bn or 0)
              ti=log.get('transactionIndex'); ti=int(ti,16) if isinstance(ti,str) and ti.startswith('0x') else int(ti or 0)
              li=log.get('logIndex'); li=int(li,16) if isinstance(li,str) and li.startswith('0x') else int(li or 0)
              rows.append((bn,ti,li,frm,to,value,log.get('transactionHash')))
          rows.sort()
          for _,_,_,frm,to,value,_ in rows:
              if frm!=zero: balances[frm]=balances.get(frm,0)-value
              if to!=zero: balances[to]=balances.get(to,0)+value
          holders=[{'address':a,'shares_raw':v} for a,v in balances.items() if v>0]
          holders.sort(key=lambda x:x['shares_raw'],reverse=True)

          # Flatten transaction-local calls to identify every call involving vault and possible remediation call.
          flat=[]
          def walk(obj,path='root'):
              if isinstance(obj,dict):
                  addr=''
                  v=obj.get('to')
                  if isinstance(v,str): addr=v.lower()
                  elif isinstance(v,dict): addr=str(v.get('hash') or v.get('address') or '').lower()
                  method=str(obj.get('method') or '')
                  inp=str(obj.get('input') or obj.get('raw_input') or '')
                  if addr==vault or 'dealbaddebt' in method.lower() or 'redeemorder' in method.lower():
                      flat.append({'path':path,'type':obj.get('type'),'call_type':obj.get('call_type'),'from':obj.get('from'),'to':obj.get('to'),'method':obj.get('method'),'input':inp})
                  for k,val in obj.items(): walk(val,path+'.'+str(k))
              elif isinstance(obj,list):
                  for i,val in enumerate(obj): walk(val,f'{path}[{i}]')
          walk(internal)
          walk(transaction)

          # Keep a compact token-flow summary with token metadata; useful for identifying debt/collateral decimals.
          transfer_items=[]
          if isinstance(transfers,dict):
              ti=transfers.get('items') or []
              if isinstance(ti,list): transfer_items=ti
          compact=[]
          for x in transfer_items:
              token=x.get('token') or {}; total=x.get('total') or {}
              def ah(v):
                  if isinstance(v,dict): return v.get('hash')
                  return v
              compact.append({
                  'from':ah(x.get('from')),'to':ah(x.get('to')),'type':x.get('type'),
                  'token_address':token.get('address_hash'),'token_symbol':token.get('symbol'),'token_name':token.get('name'),
                  'token_decimals':token.get('decimals'),'value_raw':total.get('value'),'value_decimals':total.get('decimals')
              })

          out={
              'tx_hash':tx,'vault':vault,'order':order,'settlement_block':block,'preblock':preblock,
              'transaction':transaction,'internal_transactions':internal,'logs_v2':logs,
              'token_transfers_compact':compact,'share_transfer_log_count':len(rows),
              'historical_share_holders_preblock':holders[:50],'vault_call_trace_hits':flat,
              'expected_event':{'bad_debt_raw':939875,'delivery_raw':9267}
          }
          Path('production-evidence/usdc_positive_baddebt_tx_forensics.json').write_text(json.dumps(out,indent=2,sort_keys=True))

          txj=transaction if isinstance(transaction,dict) else {}
          def ah(v): return v.get('hash') if isinstance(v,dict) else v
          print('TX_FROM',ah(txj.get('from'))); print('TX_TO',ah(txj.get('to'))); print('TX_METHOD',txj.get('method')); print('TX_STATUS',txj.get('status'))
          print('SHARE_TRANSFER_LOGS',len(rows)); print('TOP_SHARE_HOLDERS_PREBLOCK')
          for h in holders[:15]: print(json.dumps(h,sort_keys=True))
          print('VAULT_CALL_TRACE_HITS',len(flat))
          for h in flat[:30]: print(json.dumps(h,default=str,sort_keys=True)[:3000])
          print('TOKEN_TRANSFERS')
          for x in compact: print(json.dumps(x,sort_keys=True))
          PY

      - name: Commit forensic evidence
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "termmax-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add production-evidence/usdc_positive_baddebt_tx_forensics.json
          git commit -m "Record USDC positive bad-debt transaction forensics" || exit 0
          git pull --rebase origin audit/termmax-production-evidence
          git push origin HEAD:audit/termmax-production-evidence

      - uses: actions/upload-artifact@v4
        with:
          name: usdc-positive-baddebt-forensics
          path: repo/production-evidence/usdc_positive_baddebt_tx_forensics.json
