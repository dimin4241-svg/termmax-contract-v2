name: TermMax current negative recovery scan

on:
  push:
    branches:
      - audit/termmax-production-evidence
    paths:
      - .github/workflows/current-negative-recovery-scan.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    name: Rank current matured orders by economic deficit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch audit/termmax-production-evidence \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install dependencies
        run: python3 -m pip install --user --upgrade "web3==7.13.0"

      - name: Scan deployed V2 vaults at fresh mainnet state
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p production-evidence
          python3 - <<'PY'
          import glob, json, time, urllib.parse, urllib.request
          from pathlib import Path
          from eth_abi import decode
          from eth_utils import to_checksum_address
          from web3 import Web3, HTTPProvider

          NEW_ORDER_TOPIC='0x3ca4bef6cb680238d8c3dcdcca83a5aadcadff2571d3a2c67ee85b2750944b97'
          USD_BASE=10**8
          LIQUIDATION_WINDOW=2*60*60
          KNOWN_TARGET='0xF488ccdf04079cC03183cDB6A147d12Cf97F9317'
          RPCS=[
              'https://eth.drpc.org',
              'https://ethereum.publicnode.com',
              'https://eth.merkle.io',
              'https://1rpc.io/eth',
              'https://rpc.ankr.com/eth',
              'https://eth-mainnet.public.blastapi.io',
              'https://mainnet.gateway.tenderly.co',
              'https://rpc.flashbots.net',
              'https://eth.llamarpc.com',
          ]

          VAULT_ABI=[
              {'type':'function','name':'orderMaturity','stateMutability':'view','inputs':[{'name':'order','type':'address'}],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'totalAssets','stateMutability':'view','inputs':[],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'totalSupply','stateMutability':'view','inputs':[],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'maxDeposit','stateMutability':'view','inputs':[{'name':'receiver','type':'address'}],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'asset','stateMutability':'view','inputs':[],'outputs':[{'type':'address'}]},
              {'type':'function','name':'pool','stateMutability':'view','inputs':[],'outputs':[{'type':'address'}]},
          ]
          ORDER_ABI=[{'type':'function','name':'market','stateMutability':'view','inputs':[],'outputs':[{'type':'address'}]}]
          MARKET_ABI=[
              {'type':'function','name':'tokens','stateMutability':'view','inputs':[],'outputs':[{'type':'address'},{'type':'address'},{'type':'address'},{'type':'address'},{'type':'address'}]},
              {'type':'function','name':'previewRedeem','stateMutability':'view','inputs':[{'name':'ftAmount','type':'uint256'}],'outputs':[{'type':'uint256'},{'type':'bytes'}]},
          ]
          GT_ABI=[
              {'type':'function','name':'getCollateralValue','stateMutability':'view','inputs':[{'name':'collateralData','type':'bytes'}],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'liquidatable','stateMutability':'view','inputs':[],'outputs':[{'type':'bool'}]},
          ]
          ERC20_ABI=[
              {'type':'function','name':'balanceOf','stateMutability':'view','inputs':[{'name':'account','type':'address'}],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'decimals','stateMutability':'view','inputs':[],'outputs':[{'type':'uint8'}]},
              {'type':'function','name':'symbol','stateMutability':'view','inputs':[],'outputs':[{'type':'string'}]},
          ]

          def connect():
              errors=[]
              for url in RPCS:
                  try:
                      p=HTTPProvider(url,request_kwargs={'timeout':30,'headers':{'User-Agent':'curl/8.5.0','Accept':'application/json','Content-Type':'application/json'}})
                      w3=Web3(p)
                      cid=w3.eth.chain_id; latest=w3.eth.block_number
                      if cid!=1: raise RuntimeError(f'chain_id={cid}')
                      print('SELECTED_RPC',url,'LATEST',latest,flush=True)
                      return w3,url,latest
                  except Exception as e:
                      errors.append(f'{url}: {e}')
                      print('RPC_REJECT',url,e,flush=True)
              raise RuntimeError('No Ethereum RPC succeeded: '+ ' | '.join(errors))

          def api_logs(address, topic0):
              params={'module':'logs','action':'getLogs','fromBlock':'0','toBlock':'latest','address':address,'topic0':topic0}
              url='https://eth.blockscout.com/api?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':'curl/8.5.0','Accept':'application/json'})
              last=None
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(req,timeout=60) as r: payload=json.loads(r.read())
                      result=payload.get('result') or []
                      if isinstance(result,list): return result
                      raise RuntimeError(str(payload))
                  except Exception as exc:
                      last=exc; time.sleep(min(20,2**attempt))
              raise last

          def symbol(c, block):
              try: return c.functions.symbol().call(block_identifier=block)
              except Exception: return 'UNKNOWN'

          def delivery_amount(data):
              if not data: return 0
              try: return int(decode(['uint256'],bytes(data))[0])
              except Exception: return 0

          vaults={KNOWN_TARGET.lower(): {'address':KNOWN_TARGET,'sources':['known target']}}
          for fn in glob.glob('broadcast/DeployVault.s.sol/1/*.json'):
              try: doc=json.load(open(fn))
              except Exception: continue
              for tx in doc.get('transactions',[]):
                  if tx.get('contractName')!='TermMaxVaultFactoryV2' or not str(tx.get('function','')).startswith('createVault('): continue
                  for extra in tx.get('additionalContracts') or []:
                      addr=extra.get('address')
                      if not addr: continue
                      vaults.setdefault(addr.lower(),{'address':addr,'sources':[]})['sources'].append(fn)

          w3,rpc,latest=connect()
          now=int(w3.eth.get_block(latest)['timestamp'])
          all_rows=[]; vault_rows=[]
          print('VAULT_COUNT',len(vaults),flush=True)

          for vi,vmeta in enumerate(vaults.values(),1):
              vaddr=to_checksum_address(vmeta['address'])
              print(f'VAULT_SCAN {vi}/{len(vaults)} {vaddr}',flush=True)
              vrow={'vault':vaddr,'sources':vmeta['sources'],'orders':0,'registered':0,'matured_previewed':0,'negative':0,'errors':[]}
              try:
                  vault=w3.eth.contract(address=vaddr,abi=VAULT_ABI)
                  asset_addr=to_checksum_address(vault.functions.asset().call(block_identifier=latest))
                  asset=w3.eth.contract(address=asset_addr,abi=ERC20_ABI)
                  asset_dec=int(asset.functions.decimals().call(block_identifier=latest))
                  asset_sym=symbol(asset,latest)
                  vrow.update({'asset':asset_addr,'asset_symbol':asset_sym,'asset_decimals':asset_dec,'total_assets_raw':int(vault.functions.totalAssets().call(block_identifier=latest)),'total_supply_raw':int(vault.functions.totalSupply().call(block_identifier=latest))})
                  logs=api_logs(vaddr,NEW_ORDER_TOPIC)
                  orders=[]; seen=set()
                  for log in logs:
                      topics=log.get('topics') or []
                      if len(topics)<3: continue
                      order=to_checksum_address('0x'+str(topics[2]).removeprefix('0x')[-40:])
                      if order.lower() in seen: continue
                      seen.add(order.lower()); orders.append(order)
                  vrow['orders']=len(orders)

                  for oi,order_addr in enumerate(orders,1):
                      try:
                          maturity=int(vault.functions.orderMaturity(order_addr).call(block_identifier=latest))
                          if maturity==0: continue
                          vrow['registered']+=1
                          order=w3.eth.contract(address=order_addr,abi=ORDER_ABI)
                          market_addr=to_checksum_address(order.functions.market().call(block_identifier=latest))
                          market=w3.eth.contract(address=market_addr,abi=MARKET_ABI)
                          ft_addr,xt_addr,gt_addr,collateral_addr,debt_addr=[to_checksum_address(x) for x in market.functions.tokens().call(block_identifier=latest)]
                          ft=w3.eth.contract(address=ft_addr,abi=ERC20_ABI)
                          gt=w3.eth.contract(address=gt_addr,abi=GT_ABI)
                          debt=w3.eth.contract(address=debt_addr,abi=ERC20_ABI)
                          collateral=w3.eth.contract(address=collateral_addr,abi=ERC20_ABI)
                          face=int(ft.functions.balanceOf(order_addr).call(block_identifier=latest))
                          liquidatable=bool(gt.functions.liquidatable().call(block_identifier=latest))
                          final_deadline=maturity+(LIQUIDATION_WINDOW if liquidatable else 0)
                          if face==0 or now<final_deadline: continue
                          debt_dec=int(debt.functions.decimals().call(block_identifier=latest))
                          coll_dec=int(collateral.functions.decimals().call(block_identifier=latest))
                          debt_out,delivery_data=market.functions.previewRedeem(face).call(block_identifier=latest)
                          dbytes=bytes(delivery_data)
                          coll_out=delivery_amount(dbytes)
                          coll_usd=int(gt.functions.getCollateralValue(dbytes).call(block_identifier=latest)) if dbytes else 0
                          coll_debt_raw=coll_usd*(10**debt_dec)//USD_BASE
                          recovery=int(debt_out)+coll_debt_raw
                          deficit=max(0,face-recovery)
                          premium=recovery-face
                          vrow['matured_previewed']+=1
                          row={
                              'vault':vaddr,'asset':asset_addr,'asset_symbol':asset_sym,'asset_decimals':asset_dec,
                              'order':order_addr,'market':market_addr,'ft':ft_addr,'gt':gt_addr,'collateral':collateral_addr,'debt_token':debt_addr,
                              'debt_symbol':symbol(debt,latest),'debt_decimals':debt_dec,'collateral_symbol':symbol(collateral,latest),'collateral_decimals':coll_dec,
                              'maturity':maturity,'liquidatable':liquidatable,'final_deadline':final_deadline,
                              'face_raw':face,'debt_out_raw':int(debt_out),'delivery_collateral_raw':coll_out,'collateral_value_usd_1e8':coll_usd,
                              'collateral_value_debt_raw':coll_debt_raw,'economic_recovery_raw':recovery,'premium_over_face_raw':premium,'deficit_raw':deficit,
                              'deficit_units': deficit/(10**debt_dec),
                              'same_asset_as_debt': asset_addr.lower()==debt_addr.lower(),
                          }
                          if deficit>0:
                              vrow['negative']+=1; all_rows.append(row)
                              print('NEGATIVE',json.dumps(row,sort_keys=True),flush=True)
                      except Exception as exc:
                          vrow['errors'].append({'order':order_addr,'error':str(exc)})
                  vault_rows.append(vrow)
              except Exception as exc:
                  vrow['fatal_error']=str(exc); vault_rows.append(vrow)

          all_rows.sort(key=lambda x:(x['deficit_units'],x['deficit_raw']),reverse=True)
          same_asset=[x for x in all_rows if x['same_asset_as_debt']]
          out={
              'snapshot_block':latest,'snapshot_timestamp':now,'rpc':rpc,'vault_count':len(vaults),
              'negative_candidate_count':len(all_rows),'same_asset_negative_candidate_count':len(same_asset),
              'top_negative_candidates':all_rows,'vaults':vault_rows,
          }
          Path('production-evidence/current_negative_recovery_scan.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print('SUMMARY',json.dumps({k:out[k] for k in ['snapshot_block','snapshot_timestamp','vault_count','negative_candidate_count','same_asset_negative_candidate_count']},sort_keys=True),flush=True)
          print('TOP_CURRENT_NEGATIVE')
          for row in all_rows[:20]: print(json.dumps(row,sort_keys=True),flush=True)
          PY

      - name: Commit fresh result
        if: always()
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f production-evidence/current_negative_recovery_scan.json || exit 0
          git config user.name "termmax-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add production-evidence/current_negative_recovery_scan.json
          git commit -m "Record current negative recovery scan" || exit 0
          git pull --rebase origin audit/termmax-production-evidence
          git push origin HEAD:audit/termmax-production-evidence

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-negative-recovery-scan
          path: repo/production-evidence/current_negative_recovery_scan.json
          if-no-files-found: warn
