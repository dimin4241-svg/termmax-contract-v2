name: TermMax historical economic early-exit proof

on:
  push:
    branches:
      - audit/termmax-production-evidence
    paths:
      - .github/workflows/historical-economic-early-exit-scan.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Clone audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch audit/termmax-production-evidence \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install dependencies
        run: python3 -m pip install --user --upgrade "web3==7.13.0"

      - name: Reconstruct economic deficit and simulate real-holder exits
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p production-evidence
          python3 - <<'PY'
          import json, time
          from pathlib import Path
          from eth_abi import decode
          from web3 import Web3, HTTPProvider
          from web3.exceptions import ContractLogicError

          USD_BASE=10**8
          RPCS=[
              'https://eth.drpc.org',
              'https://ethereum.publicnode.com',
              'https://eth.merkle.io',
              'https://1rpc.io/eth',
              'https://rpc.ankr.com/eth',
              'https://eth-mainnet.public.blastapi.io',
              'https://rpc.flashbots.net',
          ]

          VAULT_ABI=[
              {'type':'function','name':'asset','stateMutability':'view','inputs':[],'outputs':[{'type':'address'}]},
              {'type':'function','name':'totalAssets','stateMutability':'view','inputs':[],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'totalSupply','stateMutability':'view','inputs':[],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'balanceOf','stateMutability':'view','inputs':[{'name':'owner','type':'address'}],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'previewRedeem','stateMutability':'view','inputs':[{'name':'shares','type':'uint256'}],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'redeem','stateMutability':'nonpayable','inputs':[{'name':'shares','type':'uint256'},{'name':'receiver','type':'address'},{'name':'owner','type':'address'}],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'badDebtMapping','stateMutability':'view','inputs':[{'name':'collateral','type':'address'}],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'orderMaturity','stateMutability':'view','inputs':[{'name':'order','type':'address'}],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'pool','stateMutability':'view','inputs':[],'outputs':[{'type':'address'}]},
          ]
          ORDER_ABI=[{'type':'function','name':'market','stateMutability':'view','inputs':[],'outputs':[{'type':'address'}]}]
          MARKET_ABI=[
              {'type':'function','name':'tokens','stateMutability':'view','inputs':[],'outputs':[{'type':'address'},{'type':'address'},{'type':'address'},{'type':'address'},{'type':'address'}]},
              {'type':'function','name':'previewRedeem','stateMutability':'view','inputs':[{'name':'ftAmount','type':'uint256'}],'outputs':[{'type':'uint256'},{'type':'bytes'}]},
          ]
          GT_ABI=[{'type':'function','name':'getCollateralValue','stateMutability':'view','inputs':[{'name':'collateralData','type':'bytes'}],'outputs':[{'type':'uint256'}]}]
          ERC20_ABI=[
              {'type':'function','name':'balanceOf','stateMutability':'view','inputs':[{'name':'account','type':'address'}],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'decimals','stateMutability':'view','inputs':[],'outputs':[{'type':'uint8'}]},
              {'type':'function','name':'symbol','stateMutability':'view','inputs':[],'outputs':[{'type':'string'}]},
          ]
          POOL_ABI=[
              {'type':'function','name':'maxWithdraw','stateMutability':'view','inputs':[{'name':'owner','type':'address'}],'outputs':[{'type':'uint256'}]},
              {'type':'function','name':'balanceOf','stateMutability':'view','inputs':[{'name':'owner','type':'address'}],'outputs':[{'type':'uint256'}]},
          ]

          def connect():
              errors=[]
              for url in RPCS:
                  try:
                      w3=Web3(HTTPProvider(url,request_kwargs={'timeout':45,'headers':{'User-Agent':'termmax-audit/1.0'}}))
                      if w3.eth.chain_id != 1: raise RuntimeError('wrong chain')
                      print('SELECTED_RPC',url,'LATEST',w3.eth.block_number,flush=True)
                      return w3,url
                  except Exception as e:
                      errors.append(f'{url}: {e}')
              raise RuntimeError('No Ethereum RPC: '+' | '.join(errors))

          def sym(c,b):
              try: return c.functions.symbol().call(block_identifier=b)
              except Exception: return 'UNKNOWN'

          def delivery_amount(data):
              if not data: return 0
              try: return int(decode(['uint256'],bytes(data))[0])
              except Exception: return 0

          w3,rpc=connect()
          ranking=json.loads(Path('production-evidence/cross_user_stale_nav_candidate_ranking.json').read_text())
          events=[e for e in ranking.get('events',[]) if int(e.get('preblock_holder_count',0)) >= 2 and e.get('preblock_holders_top10')]
          print('MULTI_HOLDER_POSITIVE_EVENTS',len(events),flush=True)
          out_rows=[]

          for i,e in enumerate(events,1):
              block=int(e['block']); pre=block-1
              vault_addr=Web3.to_checksum_address(e['vault']); order_addr=Web3.to_checksum_address(e['order'])
              holder=Web3.to_checksum_address(e['preblock_holders_top10'][0]['address'])
              row={'vault':vault_addr,'order':order_addr,'settlement_block':block,'preblock':pre,'tx_hash':e['tx_hash'],'event_bad_debt_raw':int(e['bad_debt_raw']),'holder':holder,'holder_fraction_reconstructed':e['preblock_holders_top10'][0].get('share_fraction')}
              try:
                  vault=w3.eth.contract(address=vault_addr,abi=VAULT_ABI)
                  order=w3.eth.contract(address=order_addr,abi=ORDER_ABI)
                  market_addr=Web3.to_checksum_address(order.functions.market().call(block_identifier=pre))
                  market=w3.eth.contract(address=market_addr,abi=MARKET_ABI)
                  ft_addr,xt_addr,gt_addr,collateral_addr,debt_addr=[Web3.to_checksum_address(x) for x in market.functions.tokens().call(block_identifier=pre)]
                  ft=w3.eth.contract(address=ft_addr,abi=ERC20_ABI); debt=w3.eth.contract(address=debt_addr,abi=ERC20_ABI); coll=w3.eth.contract(address=collateral_addr,abi=ERC20_ABI); gt=w3.eth.contract(address=gt_addr,abi=GT_ABI)
                  asset_addr=Web3.to_checksum_address(vault.functions.asset().call(block_identifier=pre)); asset=w3.eth.contract(address=asset_addr,abi=ERC20_ABI)
                  asset_dec=int(asset.functions.decimals().call(block_identifier=pre)); debt_dec=int(debt.functions.decimals().call(block_identifier=pre)); coll_dec=int(coll.functions.decimals().call(block_identifier=pre))
                  face=int(ft.functions.balanceOf(order_addr).call(block_identifier=pre))
                  debt_out,delivery_data=market.functions.previewRedeem(face).call(block_identifier=pre)
                  dbytes=bytes(delivery_data); coll_out=delivery_amount(dbytes)
                  coll_usd=int(gt.functions.getCollateralValue(dbytes).call(block_identifier=pre)) if dbytes else 0
                  coll_debt_raw=coll_usd*(10**debt_dec)//USD_BASE
                  recovery=int(debt_out)+coll_debt_raw
                  deficit=max(0,face-recovery)
                  maturity=int(vault.functions.orderMaturity(order_addr).call(block_identifier=pre))

                  shares_pre=int(vault.functions.balanceOf(holder).call(block_identifier=pre)); supply_pre=int(vault.functions.totalSupply().call(block_identifier=pre)); assets_pre=int(vault.functions.totalAssets().call(block_identifier=pre))
                  stale_quote_pre=int(vault.functions.previewRedeem(shares_pre).call(block_identifier=pre)) if shares_pre else 0
                  holder_fraction_exact=(shares_pre/supply_pre) if supply_pre else 0
                  predicted_shift_raw=(deficit*shares_pre)//supply_pre if supply_pre else 0

                  row.update({
                      'market':market_addr,'asset':asset_addr,'asset_symbol':sym(asset,pre),'asset_decimals':asset_dec,
                      'ft':ft_addr,'gt':gt_addr,'collateral':collateral_addr,'collateral_symbol':sym(coll,pre),'collateral_decimals':coll_dec,
                      'debt_token':debt_addr,'debt_symbol':sym(debt,pre),'debt_decimals':debt_dec,'same_asset_as_debt':asset_addr.lower()==debt_addr.lower(),
                      'maturity':maturity,'face_raw':face,'debt_out_raw':int(debt_out),'delivery_collateral_raw':coll_out,'collateral_value_usd_1e8':coll_usd,
                      'collateral_value_debt_raw':coll_debt_raw,'economic_recovery_raw':recovery,'economic_deficit_raw':deficit,'economic_deficit_debt_units':deficit/(10**debt_dec),
                      'holder_shares_pre_raw':shares_pre,'total_supply_pre_raw':supply_pre,'total_assets_pre_raw':assets_pre,'stale_redeem_quote_pre_raw':stale_quote_pre,
                      'holder_fraction_exact':holder_fraction_exact,'predicted_cross_user_shift_raw':predicted_shift_raw,'predicted_cross_user_shift_asset_units':predicted_shift_raw/(10**asset_dec) if asset_dec==debt_dec and asset_addr.lower()==debt_addr.lower() else None,
                  })

                  # Historical executable proof: simulate the real holder's permissionless ERC4626 redeem.
                  for label,b in [('pre_settlement',pre),('post_settlement',block)]:
                      try:
                          sh=int(vault.functions.balanceOf(holder).call(block_identifier=b))
                          quote=int(vault.functions.previewRedeem(sh).call(block_identifier=b)) if sh else 0
                          sim=int(vault.functions.redeem(sh,holder,holder).call({'from':holder},block_identifier=b)) if sh else 0
                          row[f'{label}_redeem_success']=True
                          row[f'{label}_holder_shares_raw']=sh
                          row[f'{label}_preview_redeem_raw']=quote
                          row[f'{label}_simulated_assets_out_raw']=sim
                      except Exception as exc:
                          row[f'{label}_redeem_success']=False
                          row[f'{label}_redeem_error']=str(exc)

                  # Show unresolved bad debt immediately after settlement and pool withdrawal capacity if a pool exists.
                  post_bad=int(vault.functions.badDebtMapping(collateral_addr).call(block_identifier=block))
                  pool_addr=Web3.to_checksum_address(vault.functions.pool().call(block_identifier=block))
                  row['post_settlement_bad_debt_mapping_raw']=post_bad; row['pool']=pool_addr
                  if int(pool_addr,16)!=0:
                      pool=w3.eth.contract(address=pool_addr,abi=POOL_ABI)
                      try: row['post_settlement_pool_max_withdraw_raw']=int(pool.functions.maxWithdraw(vault_addr).call(block_identifier=block))
                      except Exception as exc: row['post_settlement_pool_max_withdraw_error']=str(exc)

              except Exception as exc:
                  row['error']=repr(exc)
              out_rows.append(row)
              print('ROW',i,'/',len(events),json.dumps(row,sort_keys=True),flush=True)

          ranked=sorted(out_rows,key=lambda r:(r.get('predicted_cross_user_shift_asset_units') or -1,r.get('economic_deficit_debt_units') or -1),reverse=True)
          clean=[r for r in ranked if r.get('economic_deficit_raw',0)>0 and (r.get('pre_settlement_redeem_success') or r.get('post_settlement_redeem_success'))]
          out={'rpc':rpc,'multi_holder_positive_event_count':len(events),'economically_negative_and_exitable_count':len(clean),'ranked':ranked,'clean_executable_candidates':clean}
          Path('production-evidence/historical_economic_early_exit_scan.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print('SUMMARY',json.dumps({'events':len(events),'clean':len(clean)},sort_keys=True),flush=True)
          if clean:
              print('TOP_EXECUTABLE',json.dumps(clean[0],sort_keys=True),flush=True)
          PY

      - name: Commit evidence
        if: always()
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f production-evidence/historical_economic_early_exit_scan.json || exit 0
          git config user.name termmax-evidence-bot
          git config user.email actions@users.noreply.github.com
          git add production-evidence/historical_economic_early_exit_scan.json
          git commit -m "Record historical economic early-exit proof" || exit 0
          git pull --rebase origin audit/termmax-production-evidence
          git push origin HEAD:audit/termmax-production-evidence

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-economic-early-exit-scan
          path: repo/production-evidence/historical_economic_early_exit_scan.json
          if-no-files-found: warn
