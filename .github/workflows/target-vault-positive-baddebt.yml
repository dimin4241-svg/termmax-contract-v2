name: TermMax target vault positive bad debt

on:
  push:
    branches:
      - audit/termmax-production-evidence
    paths:
      - .github/workflows/target-vault-positive-baddebt.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    name: Decode target-vault RedeemOrder badDebt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch audit/termmax-production-evidence \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install Web3
        run: python3 -m pip install --user --upgrade "web3==7.13.0"

      - name: Scan RedeemOrder events
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p production-evidence
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path
          from web3 import Web3

          VAULT='0xF488ccdf04079cC03183cDB6A147d12Cf97F9317'
          FROM_BLOCK=23490022
          TOPIC='0x'+Web3.keccak(text='RedeemOrder(address,address,uint256,uint256)').hex().removeprefix('0x')
          query=urllib.parse.urlencode({
              'module':'logs',
              'action':'getLogs',
              'fromBlock':str(FROM_BLOCK),
              'toBlock':'latest',
              'address':VAULT,
              'topic0':TOPIC,
          })
          url='https://eth.blockscout.com/api?'+query
          req=urllib.request.Request(url,headers={'User-Agent':'curl/8.5.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as response:
              payload=json.loads(response.read())
          items=payload.get('result')
          if not isinstance(items,list):
              raise RuntimeError(f"Blockscout status={payload.get('status')} message={payload.get('message')} result={items}")

          rows=[]
          positives=[]
          for item in items:
              data=str(item.get('data','0x')).removeprefix('0x')
              if len(data)<128:
                  continue
              topics=item.get('topics') or []
              order='0x'+str(topics[2]).removeprefix('0x')[-40:] if len(topics)>=3 else None
              log_index=item.get('logIndex')
              row={
                  'tx_hash':item.get('transactionHash'),
                  'block':int(item.get('blockNumber','0x0'),16),
                  'log_index':int(log_index,16) if log_index else None,
                  'order':order,
                  'bad_debt_raw':int(data[0:64],16),
                  'delivery_collateral_raw':int(data[64:128],16),
              }
              rows.append(row)
              if row['bad_debt_raw']>0:
                  positives.append(row)

          rows.sort(key=lambda x:(x['block'],x['log_index'] or 0))
          positives.sort(key=lambda x:(x['bad_debt_raw'],x['block']),reverse=True)
          out={
              'source':'Blockscout topic0-filtered logs',
              'vault':VAULT,
              'from_block':FROM_BLOCK,
              'redeem_order_topic':TOPIC,
              'redeem_order_events':len(rows),
              'positive_bad_debt_events':len(positives),
              'positive_events':positives,
              'all_redeem_events':rows,
          }
          path=Path('production-evidence/target_vault_redeem_baddebt_scan.json')
          path.write_text(json.dumps(out,indent=2,sort_keys=True))
          print(f"REDEEM_ORDER_EVENTS={len(rows)}")
          print(f"POSITIVE_BAD_DEBT_EVENTS={len(positives)}")
          for row in positives:
              print('POSITIVE',json.dumps(row,sort_keys=True))
          print(path.read_text())
          PY

      - name: Commit scan result
        if: always()
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f production-evidence/target_vault_redeem_baddebt_scan.json || exit 0
          git config user.name "termmax-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add production-evidence/target_vault_redeem_baddebt_scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record target vault RedeemOrder bad-debt scan"
          git push origin HEAD:audit/termmax-production-evidence

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-vault-redeem-baddebt-scan
          path: repo/production-evidence/target_vault_redeem_baddebt_scan.json
          if-no-files-found: warn
