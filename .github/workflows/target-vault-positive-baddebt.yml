name: TermMax target vault positive bad debt

on:
  push:
    branches:
      - audit/termmax-production-evidence
    paths:
      - .github/workflows/target-vault-positive-baddebt.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    name: Decode target-vault RedeemOrder badDebt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch audit/termmax-production-evidence \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Scan RedeemOrder events
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p production-evidence
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path
          from hashlib import sha3_256

          VAULT="0xF488ccdf04079cC03183cDB6A147d12Cf97F9317"
          # Ethereum Keccak differs from hashlib.sha3_256; use the exact topic already
          # established by the repository scanner when available.
          import sys
          sys.path.insert(0,'.')
          try:
              from web3 import Web3
              TOPIC=Web3.keccak(text="RedeemOrder(address,address,uint256,uint256)").hex().lower()
          except Exception:
              # Known keccak is read from the repository scanner in the fallback below.
              import re
              text=Path('scripts/termmax_production_evidence.py').read_text()
              raise RuntimeError('web3 unavailable; workflow setup changed unexpectedly')

          base=f"https://eth.blockscout.com/api/v2/addresses/{VAULT}/logs"
          params={}
          all_items=[]
          seen=set()
          for page in range(500):
              url=base + (("?"+urllib.parse.urlencode(params)) if params else "")
              req=urllib.request.Request(url,headers={"User-Agent":"curl/8.5.0","Accept":"application/json"})
              payload=None
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(req,timeout=45) as r:
                          payload=json.loads(r.read())
                      break
                  except Exception as exc:
                      print(f"blockscout attempt={attempt+1} error={exc}", flush=True)
                      if attempt==5: raise
                      time.sleep(min(30,2**attempt))
              batch=payload.get('items',[])
              for item in batch:
                  key=(item.get('transaction_hash') or item.get('transactionHash'), item.get('index'), item.get('block_number') or item.get('blockNumber'))
                  if key not in seen:
                      seen.add(key); all_items.append(item)
              nxt=payload.get('next_page_params')
              print(f"page={page+1} batch={len(batch)} total_logs={len(all_items)} next={bool(nxt)}", flush=True)
              if not nxt: break
              params=nxt
          else:
              raise RuntimeError('pagination exceeded 500 pages')

          def norm_topic(x):
              if isinstance(x,dict): x=x.get('value') or x.get('hex')
              if x is None: return None
              s=str(x)
              return ('0x'+s if not s.startswith('0x') else s).lower()

          redeems=[]
          positives=[]
          for item in all_items:
              topics=[norm_topic(x) for x in (item.get('topics') or [])]
              topics=[x for x in topics if x]
              if not topics or topics[0] != TOPIC:
                  continue
              data=item.get('data') or '0x'
              if isinstance(data,dict): data=data.get('value') or data.get('hex') or '0x'
              raw=str(data).removeprefix('0x')
              if len(raw) < 128:
                  print('skip short data', item.get('transaction_hash'), len(raw))
                  continue
              bad_debt=int(raw[0:64],16)
              delivery=int(raw[64:128],16)
              order=None
              if len(topics) >= 3:
                  order='0x'+topics[2].removeprefix('0x')[-40:]
              tx=item.get('transaction_hash') or item.get('transactionHash')
              block=int(item.get('block_number') or item.get('blockNumber'))
              row={
                  'tx_hash':tx,
                  'block':block,
                  'order':order,
                  'bad_debt_raw':bad_debt,
                  'delivery_collateral_raw':delivery,
                  'log_index':item.get('index') or item.get('log_index') or item.get('logIndex'),
              }
              redeems.append(row)
              if bad_debt > 0: positives.append(row)

          redeems.sort(key=lambda x:(x['block'], str(x.get('log_index'))))
          positives.sort(key=lambda x:(x['bad_debt_raw'],x['block']), reverse=True)
          out={
              'vault':VAULT,
              'redeem_order_topic':TOPIC,
              'all_address_logs':len(all_items),
              'redeem_order_events':len(redeems),
              'positive_bad_debt_events':len(positives),
              'positive_events':positives,
              'all_redeem_events':redeems,
          }
          p=Path('production-evidence/target_vault_redeem_baddebt_scan.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True))
          print(f"REDEEM_ORDER_EVENTS={len(redeems)}")
          print(f"POSITIVE_BAD_DEBT_EVENTS={len(positives)}")
          for x in positives:
              print('POSITIVE',json.dumps(x,sort_keys=True))
          print(f"WROTE={p}")
          PY

      - name: Commit scan result
        if: always()
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f production-evidence/target_vault_redeem_baddebt_scan.json || exit 0
          git config user.name "termmax-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add production-evidence/target_vault_redeem_baddebt_scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record target vault RedeemOrder bad-debt scan"
          git push origin HEAD:audit/termmax-production-evidence

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-vault-redeem-baddebt-scan
          path: repo/production-evidence/target_vault_redeem_baddebt_scan.json
          if-no-files-found: warn
