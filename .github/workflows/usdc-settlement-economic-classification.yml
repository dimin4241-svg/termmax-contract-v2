name: TermMax USDC settlement economic classification

on:
  push:
    branches:
      - audit/termmax-production-evidence
    paths:
      - .github/workflows/usdc-settlement-economic-classification.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone audit branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 --branch audit/termmax-production-evidence "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Classify exact delivery economically
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p production-evidence
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          rpc='https://eth.drpc.org'
          block=24826645
          wstr='0xA3Ca88cfb7bBe9CfBd47df053ffA2130C7E6f770'
          strbtc='0xB2723d5dF98689eCA6A4E7321121662DDB9b3017'
          btcusd='0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c'
          delivery=9267
          baddebt=939875 # USDC 6 decimals
          def call(addr,sig,*args):
              out=subprocess.check_output(['cast','call',addr,sig,*map(str,args),'--block',str(block),'--rpc-url',rpc],text=True,stderr=subprocess.STDOUT)
              lines=[x.strip() for x in out.splitlines() if x.strip() and not x.startswith('Warning:')]
              return lines[-1]
          def firstint(s): return int(s.split()[0],0)
          wdec=firstint(call(wstr,'decimals()(uint8)'))
          asset=call(wstr,'asset()(address)').split()[0]
          sdec=firstint(call(strbtc,'decimals()(uint8)'))
          converted=firstint(call(wstr,'convertToAssets(uint256)(uint256)',delivery))
          # Chainlink BTC/USD canonical Ethereum feed; latestRoundData at pinned block gives historical onchain benchmark.
          rd=call(btcusd,'latestRoundData()(uint80,int256,uint256,uint256,uint80)')
          # cast prints tuple over multiple lines in some versions, so issue individual raw eth_call and ABI decode instead.
          raw=subprocess.check_output(['cast','call',btcusd,'latestRoundData()(uint80,int256,uint256,uint256,uint80)','--block',str(block),'--rpc-url',rpc],text=True,stderr=subprocess.STDOUT)
          vals=[]
          for line in raw.splitlines():
              line=line.strip()
              if not line or line.startswith('Warning:'): continue
              tok=line.split()[0]
              try: vals.append(int(tok,0))
              except: pass
          if len(vals)<5: raise RuntimeError('could not decode Chainlink round: '+raw)
          roundid,answer,started,updated,answered=vals[:5]
          pdec=firstint(call(btcusd,'decimals()(uint8)'))
          # strBTC/wBTC denomination is BTC-like with 8 decimals. Official Stroom docs describe WBTC<->strBTC converter;
          # this calculation is deliberately a conservative BTC benchmark, not the broken TermMax collateral oracle.
          usd_value_e6=(converted * answer * 10**6)//(10**sdec * 10**pdec)
          out={
            'block':block,'wstrbtc':wstr,'wstrbtc_decimals':wdec,'underlying_asset':asset,'strbtc':strbtc,
            'strbtc_decimals':sdec,'delivery_wstrbtc_raw':delivery,'convertToAssets_strbtc_raw':converted,
            'chainlink_btc_usd_feed':btcusd,'chainlink_round_id':roundid,'chainlink_btc_usd_answer_raw':answer,
            'chainlink_price_decimals':pdec,'chainlink_updated_at':updated,
            'btc_benchmark_delivery_value_usdc_raw_floor':usd_value_e6,
            'bad_debt_usdc_raw':baddebt,
            'benchmark_surplus_over_bad_debt_usdc_raw':usd_value_e6-baddebt,
            'classification':'collateral benchmark value exceeds bad debt' if usd_value_e6>baddebt else 'possible uncovered deficit'
          }
          Path('production-evidence/usdc_settlement_economic_classification.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Commit evidence
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name termmax-evidence-bot
          git config user.email actions@users.noreply.github.com
          git add production-evidence/usdc_settlement_economic_classification.json
          git commit -m "Classify USDC settlement collateral economically" || exit 0
          git pull --rebase origin audit/termmax-production-evidence
          git push origin HEAD:audit/termmax-production-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: usdc-settlement-economic-classification
          path: repo/production-evidence/usdc_settlement_economic_classification.json
