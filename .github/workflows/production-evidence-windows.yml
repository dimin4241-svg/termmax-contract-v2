name: TermMax production evidence Windows

on:
  push:
    branches:
      - audit/termmax-production-evidence
    paths:
      - .github/workflows/production-evidence-windows.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: termmax-production-windows-${{ github.sha }}
  cancel-in-progress: true

jobs:
  collect:
    name: Shell-only read-only chain scan on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Clone technical branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch audit/termmax-production-evidence "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" repo

      - name: Install dependencies
        shell: pwsh
        run: py -m pip install --upgrade "web3==7.13.0"

      - name: Select archive RPC and collect evidence
        shell: pwsh
        working-directory: repo
        run: |
          @'
          import json, os, urllib.request
          endpoints=[
            "https://eth.drpc.org","https://ethereum.publicnode.com","https://eth.merkle.io",
            "https://1rpc.io/eth","https://rpc.ankr.com/eth","https://eth-mainnet.public.blastapi.io",
            "https://mainnet.gateway.tenderly.co","https://cloudflare-eth.com",
            "https://rpc.flashbots.net","https://eth.llamarpc.com"]
          vault="0xF488ccdf04079cC03183cDB6A147d12Cf97F9317"
          hist=hex(25420688); log_block=hex(25420689)
          def rpc(url,method,params):
            data=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
            req=urllib.request.Request(url,data=data,headers={"Content-Type":"application/json","User-Agent":"curl/8.5.0","Accept":"application/json"})
            with urllib.request.urlopen(req,timeout=30) as r: value=json.loads(r.read())
            if value.get("error") or value.get("result") is None: raise RuntimeError(value)
            return value["result"]
          errors=[]
          for endpoint in endpoints:
            try:
              rpc(endpoint,"eth_getLogs",[{"address":vault,"fromBlock":log_block,"toBlock":log_block}])
              rpc(endpoint,"eth_call",[{"to":vault,"data":"0x38d52e0f"},hist])
              rpc(endpoint,"eth_getCode",[vault,hist])
              open("selected_rpc.txt","w").write(endpoint)
              print("Selected",endpoint)
              break
            except Exception as exc:
              errors.append(f"{endpoint}: {exc}"); print("Rejected",endpoint,exc)
          else: raise SystemExit("No archive RPC passed:\n"+"\n".join(errors))
          '@ | Set-Content select_rpc.py
          py select_rpc.py
          $env:ETH_RPC_URL = Get-Content selected_rpc.txt
          @'
          import os
          import scripts.termmax_production_evidence as scanner
          from web3 import HTTPProvider as BaseHTTPProvider
          def provider(url,request_kwargs=None):
            kwargs=dict(request_kwargs or {}); headers=dict(kwargs.pop("headers",{}) or {})
            headers.update({"User-Agent":"curl/8.5.0","Content-Type":"application/json","Accept":"application/json"})
            return BaseHTTPProvider(url,request_kwargs={**kwargs,"headers":headers})
          scanner.HTTPProvider=provider; scanner.RPC_URLS=[os.environ["ETH_RPC_URL"]]
          raise SystemExit(scanner.main())
          '@ | Set-Content run_scanner.py
          py run_scanner.py
          Get-Content production-evidence/production_evidence.md

      - name: Commit evidence
        if: success()
        shell: pwsh
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "termmax-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add production-evidence/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No evidence changes"; exit 0 }
          git commit -m "Record TermMax production evidence from Windows"
          git push origin HEAD:audit/termmax-production-evidence
