name: TermMax Routescan multichain vault bad-debt scan

on:
  push:
    branches:
      - audit/termmax-production-evidence
    paths:
      - .github/workflows/routescan-multichain-vault-baddebt.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone audit branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 --branch audit/termmax-production-evidence "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Query indexed RedeemOrder logs across supported mainnets
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p production-evidence
          python3 - <<'PY'
          import glob, json, re, time, urllib.parse, urllib.request
          from pathlib import Path

          # Current TermMax deployment directories mapped to EVM chain IDs.
          chains={
            'eth-mainnet':1,
            'arb-mainnet':42161,
            'base-mainnet':8453,
            'bnb-mainnet':56,
            'bera-mainnet':80094,
            'b2-mainnet':223,
            'hyperevm-mainnet':999,
            'pharos-mainnet':688688,
            'plasma-mainnet':9745,
          }
          topic='0x21f71f6609f50b01dbe90a67add86958b134ef6fa7e8c668df45730004806242'
          routescan='https://api.routescan.io/v2/network/mainnet/evm/{chain}/etherscan/api'

          def request_json(url, tries=5):
            last=None
            for i in range(tries):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'termmax-security-validation/1.0','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read())
              except Exception as e:
                last=e; time.sleep(min(8,2**i))
            return {'_error':repr(last),'_url':url}

          # Parse every explicit VAULT_ADDRESS from deployment env files; retain earliest declared deployment block.
          deployed={}
          for dirname,chainid in chains.items():
            rows={}
            for f in glob.glob(f'deployments/{dirname}/*.env'):
              txt=Path(f).read_text(errors='ignore')
              bm=re.search(r'^BLOCK_NUMBER=(\d+)',txt,re.M)
              start=int(bm.group(1)) if bm else 0
              for m in re.finditer(r'^VAULT_ADDRESS(?:_\d+)?=(0x[a-fA-F0-9]{40})',txt,re.M):
                a=m.group(1).lower()
                rows[a]=min(rows.get(a,start),start)
            deployed[dirname]={'chain_id':chainid,'vaults':rows}

          results={}; positives=[]
          for dirname,cfg in deployed.items():
            chainid=cfg['chain_id']; vault_rows=[]
            for vault,start in sorted(cfg['vaults'].items()):
              q=urllib.parse.urlencode({
                'module':'logs','action':'getLogs','fromBlock':str(start),'toBlock':'latest',
                'address':vault,'topic0':topic,
              })
              url=routescan.format(chain=chainid)+'?'+q
              payload=request_json(url)
              raw=payload.get('result') if isinstance(payload,dict) else None
              events=[]
              if isinstance(raw,list):
                for x in raw:
                  data=str(x.get('data') or '0x').removeprefix('0x')
                  if len(data)<128: continue
                  topics=x.get('topics') or []
                  row={
                    'chain':dirname,'chain_id':chainid,'vault':vault,
                    'block':int(str(x.get('blockNumber') or '0x0'),16),
                    'tx_hash':x.get('transactionHash'),
                    'order':'0x'+str(topics[2]).removeprefix('0x')[-40:] if len(topics)>2 else None,
                    'bad_debt_raw':int(data[:64],16),
                    'delivery_raw':int(data[64:128],16),
                  }
                  events.append(row)
                  if row['bad_debt_raw']>0: positives.append(row)
              vault_rows.append({
                'vault':vault,'start_block':start,'event_count':len(events),
                'positive_count':sum(1 for e in events if e['bad_debt_raw']>0),
                'events':events,'api_status':payload.get('status') if isinstance(payload,dict) else None,
                'api_message':payload.get('message') if isinstance(payload,dict) else None,
                'api_error':payload.get('_error') if isinstance(payload,dict) else None,
              })
              print(dirname,vault,'events',len(events),'positive',vault_rows[-1]['positive_count'],'status',vault_rows[-1]['api_status'],vault_rows[-1]['api_message'])
              time.sleep(0.55) # Routescan keyless tier is 2 req/s.
            results[dirname]={'chain_id':chainid,'vault_count':len(cfg['vaults']),'vaults':vault_rows}

          positives.sort(key=lambda r:r['bad_debt_raw'],reverse=True)
          out={'source':'Routescan Etherscan-compatible keyless API','topic0':topic,'chains':results,'positive_events_ranked_raw':positives}
          Path('production-evidence/routescan_multichain_baddebt.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print('TOTAL_POSITIVE',len(positives))
          for row in positives[:100]: print('POSITIVE',json.dumps(row,sort_keys=True))
          PY

      - name: Commit scan evidence
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name termmax-evidence-bot
          git config user.email actions@users.noreply.github.com
          git add production-evidence/routescan_multichain_baddebt.json
          git commit -m "Record Routescan multichain bad-debt scan" || exit 0
          git pull --rebase origin audit/termmax-production-evidence
          git push origin HEAD:audit/termmax-production-evidence

      - uses: actions/upload-artifact@v4
        with:
          name: routescan-multichain-baddebt
          path: repo/production-evidence/routescan_multichain_baddebt.json
