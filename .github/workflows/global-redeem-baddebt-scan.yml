name: TermMax global RedeemOrder bad debt scan

on:
  push:
    branches:
      - audit/termmax-production-evidence
    paths:
      - .github/workflows/global-redeem-baddebt-scan.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch audit/termmax-production-evidence "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install Web3
        run: python3 -m pip install --user --upgrade "web3==7.13.0"

      - name: Scan all Ethereum RedeemOrder events
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p production-evidence
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path
          from web3 import Web3

          FROM_BLOCK=22283087
          TARGET='0xf488ccdf04079cc03183cdb6a147d12cf97f9317'
          TOPIC='0x'+Web3.keccak(text='RedeemOrder(address,address,uint256,uint256)').hex().removeprefix('0x')
          q=urllib.parse.urlencode({
              'module':'logs','action':'getLogs','fromBlock':FROM_BLOCK,'toBlock':'latest','topic0':TOPIC
          })
          url='https://eth.blockscout.com/api?'+q
          req=urllib.request.Request(url,headers={'User-Agent':'curl/8.5.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=90) as r:
              payload=json.loads(r.read())
          items=payload.get('result')
          if not isinstance(items,list):
              raise RuntimeError(f"Blockscout status={payload.get('status')} message={payload.get('message')} result={items}")

          rows=[]
          for item in items:
              data=str(item.get('data','0x')).removeprefix('0x')
              if len(data)<128: continue
              topics=item.get('topics') or []
              row={
                  'vault':str(item.get('address','')).lower(),
                  'tx_hash':item.get('transactionHash'),
                  'block':int(item.get('blockNumber','0x0'),16),
                  'log_index':int(item.get('logIndex','0x0'),16) if item.get('logIndex') else None,
                  'order':'0x'+str(topics[2]).removeprefix('0x')[-40:] if len(topics)>=3 else None,
                  'bad_debt_raw':int(data[:64],16),
                  'delivery_collateral_raw':int(data[64:128],16),
              }
              rows.append(row)

          positives=[r for r in rows if r['bad_debt_raw']>0]
          positives.sort(key=lambda r:(r['bad_debt_raw'],r['block']),reverse=True)
          by_vault={}
          for r in rows:
              v=r['vault']
              d=by_vault.setdefault(v,{'redeems':0,'positive_count':0,'max_bad_debt_raw':0,'max_event':None})
              d['redeems']+=1
              if r['bad_debt_raw']>0:
                  d['positive_count']+=1
              if r['bad_debt_raw']>d['max_bad_debt_raw']:
                  d['max_bad_debt_raw']=r['bad_debt_raw']; d['max_event']=r

          vaults=sorted(
              ({'vault':v,**d} for v,d in by_vault.items()),
              key=lambda x:(x['max_bad_debt_raw'],x['positive_count'],x['redeems']),reverse=True
          )
          out={
              'source':'Blockscout Etherscan-compatible topic0-only getLogs',
              'from_block':FROM_BLOCK,
              'redeem_order_topic':TOPIC,
              'event_count':len(rows),
              'vault_count':len(by_vault),
              'positive_event_count':len(positives),
              'global_max_bad_debt_raw':positives[0]['bad_debt_raw'] if positives else 0,
              'global_max_event':positives[0] if positives else None,
              'target_summary':by_vault.get(TARGET),
              'vaults_ranked':vaults,
              'positive_events_ranked':positives,
          }
          p=Path('production-evidence/global_redeem_baddebt_scan.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True))
          print('EVENT_COUNT',len(rows))
          print('VAULT_COUNT',len(by_vault))
          print('POSITIVE_EVENT_COUNT',len(positives))
          print('GLOBAL_MAX_BAD_DEBT_RAW',out['global_max_bad_debt_raw'])
          print('GLOBAL_MAX_EVENT',json.dumps(out['global_max_event'],sort_keys=True))
          print('TOP_VAULTS')
          for row in vaults[:20]: print(json.dumps(row,sort_keys=True))
          PY

      - name: Commit result
        if: always()
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f production-evidence/global_redeem_baddebt_scan.json || exit 0
          git config user.name "termmax-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add production-evidence/global_redeem_baddebt_scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record global RedeemOrder bad-debt scan"
          git push origin HEAD:audit/termmax-production-evidence

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-redeem-baddebt-scan
          path: repo/production-evidence/global_redeem_baddebt_scan.json
          if-no-files-found: warn
